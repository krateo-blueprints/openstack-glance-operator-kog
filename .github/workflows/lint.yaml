name: lint

# Lints and renders every chart on pull requests, and validates that each chart's values.yaml
# satisfies its values.schema.json. Shape-agnostic: charts are discovered by locating each
# Chart.yaml (skipping vendored subcharts under charts/), so it works for any repo layout.
on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@main

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Stamp the CHART_VERSION placeholder for CI
        run: |
          find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' \
            -exec sed -i "s/CHART_VERSION/0.0.0-ci/g" {} +

      # Gating. A findby whose identifiers are not keys of the list item can never match, so absence
      # is inferred every reconcile and create re-fires. Also refuses an undeclared findby item.
      # Self-tests first. (Origin: keystone-kog IdentityRoleAssignment, data-plane run dp303.)
      - name: findby identifiers are keys of the list item
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "pyyaml==6.0.2"
          python3 hack/validate-findby-identifiers.py chart

      # Gating. ImageImport's notFoundBody decides when the import is sent. It must fire for a
      # never-imported image and must NOT fire for a failed import, which would loop forever.
      - name: ImageImport predicate against every image state (hack/test-image-import-predicate.py)
        run: python3 hack/test-image-import-predicate.py chart

      # Gating. Every identifier and additionalStatusField must be present in the response schema its
      # observe verb reads (through response fieldMappings, minus sources they remove);
      # rest-dynamic-controller skips an absent one silently, so the status column stays empty.
      - name: Every status field resolves in its observe response (hack/validate-status-fields.py)
        run: python3 hack/validate-status-fields.py chart

      # Gating. release-tag attaches the stamped CompositionDefinition to a release that release-notes
      # may create concurrently; the publisher must treat "already exists" as success and still fail on
      # anything else. Runs against a stand-in gh, no network.
      - name: Release asset publisher survives the release-notes race (hack/test-publish-release-assets.sh)
        run: bash hack/test-publish-release-assets.sh

      - name: helm template + lint every chart (informational)
        run: |
          set -uo pipefail
          # Informational only: charts across repos legitimately require values or private
          # dependencies to render, so render/lint issues are surfaced as warnings, never failing
          # the build. The lint-docs job above is the authoritative gate.
          while IFS= read -r -d '' cf; do
            dir=$(dirname "$cf")
            echo "::group::${dir}"
            helm dependency update "$dir" 2>/dev/null || true
            helm template release "$dir" >/dev/null \
              || echo "::warning::helm template failed for ${dir} (may require values or private deps)"
            helm lint "$dir" || true
            echo "::endgroup::"
          done < <(find . -type f -name Chart.yaml -not -path '*/charts/*' -not -path './.git/*' -print0)
